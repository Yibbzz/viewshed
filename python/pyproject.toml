[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "viewshed"
version = "0.3.0"
description = "Fast, exact line-of-sight viewsheds."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["numpy>=1.21"]
keywords = ["viewshed", "gis", "visibility", "line-of-sight", "terrain", "lidar", "ztv"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Repository = "https://github.com/Yibbzz/viewshed"
Issues = "https://github.com/Yibbzz/viewshed/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
manifest-path = "../crates/viewshed-py/Cargo.toml"
module-name = "viewshed._viewshed"
python-source = "."
features = ["pyo3/extension-module"]
