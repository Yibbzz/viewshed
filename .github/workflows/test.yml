name: test

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release -p viewshed

  python:
    # Builds the package and runs its tests plus the conformance suite (oracles,
    # analytic scenes, sweep and bindings cell for cell). GRASS and GDAL tests are
    # skipped where those aren't installed; the pinned Docker image (planned) runs them.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install
        working-directory: python
        run: |
          python -m venv .venv
          ${{ runner.os == 'Windows' && '.venv\Scripts\python' || '.venv/bin/python' }} -m pip install maturin pytest numpy
          ${{ runner.os == 'Windows' && '.venv\Scripts\maturin' || '.venv/bin/maturin' }} develop --release
      - name: Package tests
        working-directory: python
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python' || '.venv/bin/python' }} -m pytest -q tests
      - name: Conformance tests
        working-directory: conformance
        run: ${{ runner.os == 'Windows' && '..\python\.venv\Scripts\python' || '../python/.venv/bin/python' }} -m pytest -q tests
