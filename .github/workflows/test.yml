name: test

on:
  push:
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_versions.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release -p viewshed

  python:
    # Builds the package and runs its tests plus the conformance suite (oracles,
    # analytic scenes, golden outputs, sweep and bindings cell for cell). GRASS and
    # GDAL tests are skipped where those aren't installed. uv supplies each Python,
    # including 3.9 (the oldest the abi3 wheel supports), which the runners no
    # longer ship.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build and install
        working-directory: python
        run: |
          uv venv --python ${{ matrix.python }} .venv
          PY=$([ "$RUNNER_OS" = Windows ] && echo .venv/Scripts/python || echo .venv/bin/python)
          uv pip install --python "$PY" maturin pytest numpy
          VIRTUAL_ENV=$PWD/.venv "$PY" -m maturin develop --release
          echo "PY=$PWD/$PY" >> "$GITHUB_ENV"
      - name: Package tests
        working-directory: python
        run: '"$PY" -m pytest -q tests'
      - name: Conformance tests
        working-directory: conformance
        env:
          CONFORMANCE_STRICT: "1"
        run: '"$PY" -m pytest -q -rs tests'
