name: test

on:
  push:
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_versions.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release -p viewshed

  python:
    # Builds the package and runs its tests plus the conformance suite (oracles,
    # analytic scenes, golden outputs, sweep and bindings cell for cell, and the
    # fast oracles bit for bit against oracle.py, numba included). GRASS and
    # GDAL tests are skipped where those aren't installed. uv supplies each Python,
    # including 3.9 (the oldest the abi3 wheel supports), which the runners no
    # longer ship.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build and install
        working-directory: python
        run: |
          uv venv --python ${{ matrix.python }} .venv
          PY=$([ "$RUNNER_OS" = Windows ] && echo .venv/Scripts/python || echo .venv/bin/python)
          uv pip install --python .venv maturin pytest numpy numba
          "$PY" -c "import numba; print('numba', numba.__version__)"   # oracle_numba's tests must run
          VIRTUAL_ENV=$PWD/.venv "$PY" -m maturin develop --release
          echo "PY=$PWD/$PY" >> "$GITHUB_ENV"
      - name: Package tests
        working-directory: python
        run: '"$PY" -m pytest -q tests'
      - name: Conformance tests
        working-directory: conformance
        env:
          CONFORMANCE_STRICT: "1"
        run: '"$PY" -m pytest -q -rs tests'

  grass:
    # The two tests that tie oracle_rviewshed to GRASS r.viewshed itself (every
    # cell, flat and with curvature). They skip where GRASS isn't installed, so
    # this job fails if they didn't run. GRASS's Python side needs the distro's
    # GDAL bindings, hence a venv on the system Python with its site-packages.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GRASS and GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends grass-core python3-gdal python3-numpy python3-pytest python3-venv
          grass --version
      - name: Build and install
        working-directory: python
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install maturin
          VIRTUAL_ENV=$PWD/.venv .venv/bin/python -m maturin develop --release
      - name: Conformance tests including GRASS
        working-directory: conformance
        env:
          CONFORMANCE_STRICT: "1"
        run: |
          ../python/.venv/bin/python -m pytest -q -rs tests | tee pytest.out
          if grep -q "GRASS GIS not installed" pytest.out; then
            echo "::error::GRASS tests were skipped"; exit 1
          fi
