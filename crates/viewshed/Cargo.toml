[package]
name = "viewshed"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Fast, exact line-of-sight viewsheds: the GRASS r.viewshed model, and exact line of sight on the bilinear surface."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yibbzz/viewshed"
documentation = "https://docs.rs/viewshed"
readme = "README.md"
keywords = ["viewshed", "gis", "visibility", "line-of-sight", "terrain"]
categories = ["science::geo", "algorithms"]

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rayon = "1"
